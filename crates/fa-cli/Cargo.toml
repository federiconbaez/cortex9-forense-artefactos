[package]
name = "fa-cli"
description = "CLI cortex9-forense-artefactos (fa / forense-artefactos)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "fa"

[[bin]]
name = "fa"
path = "src/main.rs"

[[bin]]
name = "forense-artefactos"
path = "src/bin/forense_artefactos.rs"

[dependencies]
fa-core = { workspace = true }
fa-checker = { workspace = true }
fa-models = { workspace = true }
fa-pate = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "fa-bench"
path = "benches/throughput.rs"
