name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix:
    name: fmt+clippy+test+measure (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: measure ci + mutants
        run: cargo run --release -p fa-cli --bin fa -- all --mode ci
      - name: pate example
        run: cargo run -p fa-pate --example pate_demo
      - name: audit
        if: matrix.toolchain == 'stable'
        run: cargo audit || echo "AUDIT_SOFT_FAIL declared"
