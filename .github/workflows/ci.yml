name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: fmt + clippy + test + measure-ci + bfs + mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: measure ci (1e4) + bfs + mutants
        run: cargo run --release --quiet --bin forense-artefactos -- all --mode ci
      - name: catalog
        run: cargo run --release --quiet --bin forense-artefactos -- catalog
