[workspace]
resolver = "2"
members = [
  "crates/fa-core",
  "crates/fa-checker",
  "crates/fa-models",
  "crates/fa-pate",
  "crates/fa-cli",
]
default-members = ["crates/fa-cli"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Federico Nicolas Baez Rizzo"]
repository = "https://github.com/federiconbaez/cortex9-forense-artefactos"
publish = false

[workspace.dependencies]
fa-core = { path = "crates/fa-core", version = "0.2.0" }
fa-checker = { path = "crates/fa-checker", version = "0.2.0" }
fa-models = { path = "crates/fa-models", version = "0.2.0" }
fa-pate = { path = "crates/fa-pate", version = "0.2.0" }
rayon = "1.10"
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
